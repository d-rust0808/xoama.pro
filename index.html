<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.Y.S.T.E.M // OVERRIDE</title>
    <style>
        /* Import font kiểu Terminal đỉnh cao */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505;
            font-family: 'Share Tech Mono', monospace;
            color: #20c20e;
            overflow: hidden;
            user-select: none;
        }

        /* ---------------- MATRIX BACKGROUND ---------------- */
        #matrix {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.35; /* Làm mờ vừa phải để không rối */
        }

        /* ---------------- RAW HEX DUMP BACKGROUND ---------------- */
        .hex-bg {
            position: absolute;
            right: 0; top: 0;
            width: 30%; height: 100%;
            overflow: hidden;
            opacity: 0.2;
            font-size: 0.8rem;
            color: #1a6d36;
            word-wrap: break-word;
            z-index: 0;
            text-align: right;
            padding-right: 15px;
            font-family: monospace;
        }

        /* ---------------- HIỆU ỨNG MÀN HÌNH CRT CŨ ---------------- */
        .crt-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.95);
        }

        /* ---------------- BẢNG TELEMETRY HUD GÓC TRÁI ---------------- */
        .hud {
            position: absolute;
            top: 25px; left: 25px;
            z-index: 5;
            font-size: 0.9rem;
            color: #20c20e;
            text-shadow: 0 0 5px #20c20e;
            line-height: 1.6;
            opacity: 0.9;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-left: 2px solid #20c20e;
            padding-left: 10px;
        }
        
        @media (max-width: 768px) {
            .hud { font-size: 0.75rem; }
            .hex-bg { display: none; }
        }

        .hud span { color: #fff; }
        .blink-red { color: #ff3333 !important; text-shadow: 0 0 10px red !important; animation: blinkWarning 1s infinite; font-weight: bold;}
        @keyframes blinkWarning { 0%, 100% {opacity:1;} 50% {opacity:0;} }

        /* ---------------- KHUNG TOOL CHÍNH TRONG SUỐT ---------------- */
        .modal {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 750px;
            background: rgba(0, 15, 10, 0.75);
            border: 1px solid #1a6d36;
            box-shadow: 0 0 40px rgba(32, 194, 14, 0.15), inset 0 0 25px #000;
            backdrop-filter: blur(12px);
            border-radius: 6px;
            z-index: 5;
            padding: 4px; /* Viền ngoài kim loại */
        }

        .modal-inner {
            border: 1px dashed #1a6d36;
            padding: 35px;
            border-radius: 4px;
            position: relative;
        }

        /* Khung quét ngang màn hình modal */
        .scan-bar {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: rgba(32, 194, 14, 0.4);
            box-shadow: 0 0 15px #20c20e;
            animation: scanner 3s infinite linear;
            z-index: 100;
            pointer-events: none;
        }
        @keyframes scanner { 
            0% { top: 0%; opacity: 0; } 
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; } 
        }

        .header-title {
            font-size: 1.6rem;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #20c20e, 0 0 20px #20c20e;
            border-bottom: 2px solid #1a6d36;
            padding-bottom: 15px;
            font-weight: bold;
        }

        /* ---------------- THANH PROGRESS & SỐ % ---------------- */
        .status-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.25rem;
            text-shadow: 0 0 5px #20c20e;
            font-weight: bold;
        }

        .bar-container {
            width: 100%;
            height: 22px;
            background: #020a05;
            border: 1px solid #20c20e;
            position: relative;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(32, 194, 14, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #20c20e;
            box-shadow: 0 0 20px #20c20e;
            position: relative;
            transition: width 0.1s;
        }

        /* Sọc chéo trên thanh loading */
        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 15px,
                rgba(0,0,0,0.4) 15px,
                rgba(0,0,0,0.4) 30px
            );
        }

        /* ---------------- LOG TERMINAL ---------------- */
        .terminal {
            height: 280px;
            overflow-y: hidden;
            font-size: 1.1rem;
            line-height: 1.9;
            position: relative;
            padding-right: 10px;
        }

        .term-line {
            display: flex;
            align-items: flex-start;
            margin-bottom: 5px;
        }

        .prefix {
            color: #555;
            margin-right: 15px;
            min-width: 125px;
            font-size: 0.95rem;
            padding-top: 2px;
        }

        .message {
            color: #20c20e;
            flex-grow: 1;
            word-wrap: break-word;
        }

        .message.hl {
            color: #fff;
            text-shadow: 0 0 10px #2cfb14, 0 0 20px #2cfb14;
            font-weight: bold;
            font-size: 1.15rem;
        }

        /* ---------------- MÀN HÌNH THÀNH CÔNG ---------------- */
        .success-overlay {
            display: none; /* Sẽ được JS bật lên */
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 10, 5, 0.95);
            z-index: 200;
            text-align: center;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 4px;
            animation: fadeInGlass 0.8s ease-out;
        }

        @keyframes fadeInGlass {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(20px); }
        }

        .shield-icon {
            font-size: 4.5rem;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 20px #20c20e);
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .success-text {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 10px #20c20e, 0 0 30px #2cfb14, 0 0 50px #2cfb14;
            letter-spacing: 2px;
            margin-bottom: 45px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-hack {
            background: rgba(32, 194, 14, 0.1);
            color: #20c20e;
            border: 2px solid #20c20e;
            padding: 16px 45px;
            font-size: 1.4rem;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(32, 194, 14, 0.3);
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-hack:hover {
            background: #20c20e;
            color: #000;
            box-shadow: 0 0 30px #2cfb14, 0 0 60px #2cfb14;
            text-shadow: none;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- 1. Hiệu ứng ma trận rớt số -->
    <canvas id="matrix"></canvas>

    <!-- 2. Hiệu ứng dữ liệu chạy dọc nền -->
    <div class="hex-bg" id="hex"></div>

    <!-- 3. Hiệu ứng CRT lưới màn hình -->
    <div class="crt-effect"></div>

    <!-- 4. Bản HUD theo dõi góc trái -->
    <div class="hud">
        <div>SYS_NODE_ID: <span id="hud-node">NULL</span></div>
        <div>TARGET_HOST: <span>c168qte.com</span></div>
        <div>ENCRYPTION_BYPASS: <span id="hud-enc">AES-256</span></div>
        <div class="blink-red">WARN: ROOT ACCESS OVERRIDE IN PROGRESS</div>
    </div>

    <!-- 5. Phím điều khiển chính ở giữa -->
    <div class="modal">
        <div class="modal-inner">
            <div class="scan-bar"></div> <!-- Đường quét scanner -->

            <div class="header-title">[ HỆ THỐNG XÂM NHẬP MÃ ẨN CASINO VIP ]</div>
            
            <div class="status-row">
                <div>TIẾN TRÌNH THỰC THI:</div>
                <div id="percent">0.00%</div>
            </div>

            <div class="bar-container">
                <div class="bar-fill" id="bar"></div>
            </div>

            <div class="terminal" id="terminal">
                <!-- Data đổ xuống từ JS bằng giải thuật Dịch Mã -->
            </div>

            <!-- Khung Màn hình báo thành công sẽ che lấp màn hình đen -->
            <div class="success-overlay" id="success">
                <div class="shield-icon">🔓</div>
                <div class="success-text">XÓA MÃ ẨN & KÍCH ROOT THÀNH CÔNG</div>
                <a class="btn-hack" id="btn-link" href="">TRUY CẬP VÀO GAME NGAY ➡</a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CÀI ĐẶT URL MỤC TIÊU 
        // ==========================================
        const targetUrl = 'https://c168qte.com/'; 
        document.getElementById('btn-link').href = targetUrl;

        // --- BACKGROUND MA TRẬN (MATRIX DIGITAL RAIN) ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Font mã hóa Nhật Bản trộn Latin + Số
        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789!@#$%^&*';
        const alphabet = katakana + latin + nums;
        const fontSize = 16;
        const columns = canvas.width/fontSize;
        const drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 5, 0, 0.08)'; // Tô mờ để tạo vệt
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1a8c2d'; // Màu nền xanh của số
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                // Random ký tự xịn hơn bằng cách làm chúng sáng lên
                if (Math.random() > 0.95) {
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#fff';
                } else {
                    ctx.fillStyle = '#1a8c2d';
                    ctx.shadowBlur = 0;
                }
                ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 40);

        // --- BACKGROUND DATA HEX ---
        const hexBg = document.getElementById('hex');
        setInterval(() => {
            let str = '';
            for(let i=0; i<35; i++) str += Math.floor(Math.random()*16777215).toString(16).toUpperCase().padStart(6,'0') + '  ';
            hexBg.innerText = str + '\n' + hexBg.innerText;
            if(hexBg.innerText.length > 3000) hexBg.innerText = hexBg.innerText.substring(0, 3000);
        }, 50);

        // --- CẬP NHẬT HUD THÔNG BÁO GÓC TRÁI ---
        setInterval(() => {
            document.getElementById('hud-node').innerText = '0x' + Math.floor(Math.random()*9999999).toString(16).toUpperCase();
            const encList = ['AES-256 (BYPASSING)', 'RSA-4096 (CRACKING)', 'BLOWFISH (DECRYPT: OK)'];
            document.getElementById('hud-enc').innerText = encList[Math.floor(Math.random()*encList.length)];
        }, 800);

        // --- KỊCH BẢN XÂM NHẬP HACKER (CHUỖI LỆNH) ---
        const terminal = document.getElementById('terminal');
        const tasks = [
            { txt: "Đang mở cổng kết nối ẩn (Ghost Tunnel) tới máy chủ Casino...", hl: false },
            { txt: "Tường lửa phân tán Cloudflare tầng mạng lõi: BYPASSED", hl: false },
            { txt: "Đang dò tìm lỗ hổng trong mã nguồn lưu trữ Thuật toán...", hl: false },
            { txt: "[+] THÀNH CÔNG: Mã ẩn vô hiệu hóa truy vết IP User đã bị vô hiệu.", hl: true },
            { txt: "Đang cấu trúc lại chuỗi bảo mật RSA-4096...", hl: false },
            { txt: "Đang ghi đè dữ liệu... Kích hoạt quyền ROOT cho tài khoản.", hl: false },
            { txt: "[+] THÀNH CÔNG: Tắt cơ chế nhà cái theo dõi Lịch Sử Cược", hl: true },
            { txt: "Tiêm mã độc kích hoạt hệ số THẮNG LỚN (BIG WIN MOD)...", hl: false },
            { txt: "[+] THÀNH CÔNG: Max tỉ lệ NỔ HŨ (JACKPOT) & SCATTER cho vòng tiếp theo.", hl: true },
            { txt: "Đang xóa log quét hành vi mạng và dọn dẹp hệ thống...", hl: false },
            { txt: "[+] HOÀN TẤT. KẾT NỐI VÀO CỔNG GAME KÍCH HOẠT CHẾ ĐỘ VIP CHUẨN BỊ.", hl: true }
        ];

        // Lấy thời gian siêu chuẩn xác để làm Timestamp Hacker
        function getTimestamp() {
            let d = new Date();
            let ms = Math.floor(Math.random()*999).toString().padStart(3,'0');
            return `[${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}.${ms}]`;
        }

        // --- HIỆU ỨNG DỊCH MÃ (DECRYPT) GÂY ẢO GIÁC ---
        const scrambleChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+<>{}|?';
        async function scrambleText(element, finalString, speed = 25) {
            let iterations = 0;
            const len = finalString.length;
            return new Promise(resolve => {
                const interval = setInterval(() => {
                    let textBuffer = '';
                    for (let i = 0; i < len; i++) {
                        if (i < iterations) {
                            textBuffer += finalString[i];
                        } else {
                            // Số ký tự ngẫu nhiên liên tục thay đổi tạo cảm giác là đang hack mã hoá
                            textBuffer += scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
                        }
                    }
                    element.innerHTML = textBuffer;
                    
                    if (iterations >= len) {
                        clearInterval(interval);
                        // Make sure the exact original string is set at the end
                        element.innerHTML = finalString; 
                        resolve();
                    }
                    iterations += 0.5; // Tốc độ lộ chữ thật
                }, speed);
            });
        }

        let progress = 0;
        let taskIdx = 0;
        let isScrambling = false;
        
        async function addLogLine() {
            if (taskIdx >= tasks.length) return;
            isScrambling = true;

            const task = tasks[taskIdx];
            taskIdx++;

            const lineDiv = document.createElement('div');
            lineDiv.className = 'term-line';

            const prefix = document.createElement('div');
            prefix.className = 'prefix';
            prefix.innerText = getTimestamp();

            const msgSpan = document.createElement('div');
            msgSpan.className = 'message ' + (task.hl ? 'hl' : '');
            
            lineDiv.appendChild(prefix);
            lineDiv.appendChild(msgSpan);
            terminal.appendChild(lineDiv);
            
            // Auto scroll xuống quá trình mới
            terminal.scrollTop = terminal.scrollHeight;

            await scrambleText(msgSpan, task.txt, 15);
            isScrambling = false;
        }

        // --- LUỒNG CHẠY CHÍNH LIÊN KẾT THANH PROGRESS VÀ DỊCH MÃ ---
        function runSystem() {
            const pb = document.getElementById('bar');
            const pt = document.getElementById('percent');
            
            // Random tốc độ thanh chạy để nhìn nguy hiểm
            const inc = Math.random() * 0.7 + 0.05;
            progress += inc;
            if(progress >= 100) progress = 100;

            pb.style.width = progress + '%';
            pt.innerText = progress.toFixed(2).padStart(5,'0') + '%'; // Số thập phân nhích chi tiết

            // Mapping điểm chia độ khó giả theo dòng text
            const triggerPoints = [1, 9, 20, 31, 45, 58, 69, 81, 88, 94, 98];
            if (taskIdx < triggerPoints.length && progress >= triggerPoints[taskIdx] && !isScrambling) {
                addLogLine();
            }

            if(progress < 100) {
                // Tốc độ update GUI random chống tuyến tính nhàm chán
                setTimeout(runSystem, 25 + Math.random()*40);
            } else {
                // Cán đích 100%, chờ thêm 1s và hiển thị màn hình cuối
                setTimeout(() => {
                    document.getElementById('success').style.display = 'flex';
                }, 1000);
            }
        }

        // Trì hoãn một chút lúc load trang để khách cảm giác đang build tool...
        setTimeout(runSystem, 1500);

    </script>
</body>
</html>
